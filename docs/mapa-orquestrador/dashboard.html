<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Painel conectado à biblioteca de orquestração de agentes."><link rel="icon" href="data:,">
  <title>Mapa vivo da orquestração</title>
  <style>
    :root{--void:#0b1016;--panel:#111a23;--panel2:#0d141c;--line:rgba(190,215,222,.13);--text:#eaf1f2;--muted:#91a4aa;--cyan:#62e6d2;--cyan-bg:rgba(98,230,210,.12);--amber:#f2b85c;--blue:#90b8ff;color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--void);color:var(--text)}button,input{font:inherit}button{color:inherit}.shell{min-height:100vh;padding:22px;background:radial-gradient(circle at 52% -5%,rgba(98,230,210,.095),transparent 35%),linear-gradient(135deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,30px 30px}.top{max-width:1550px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--cyan);border-radius:12px 3px 12px 3px;color:var(--cyan);font-weight:850}.eyebrow{margin:0 0 3px;color:var(--muted);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}.top h1{margin:0;font-size:19px;letter-spacing:-.035em}.live{font-size:11px;color:var(--muted);text-align:right}.live b{color:var(--cyan);font-weight:650}.tabs{max-width:1550px;margin:18px auto 12px;display:flex;gap:5px;overflow:auto}.tab{white-space:nowrap;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 11px;color:var(--muted);font-size:12px;cursor:pointer}.tab:hover,.tab:focus-visible{background:rgba(255,255,255,.05);outline:none}.tab.active{background:var(--cyan-bg);border-color:rgba(98,230,210,.23);color:var(--cyan)}.workspace{max-width:1550px;margin:auto;min-height:720px;display:grid;grid-template-columns:270px minmax(450px,1fr) 305px;gap:12px}.panel{border:1px solid var(--line);border-radius:14px;background:rgba(17,26,35,.92);overflow:hidden;box-shadow:inset 0 1px rgba(255,255,255,.025),0 18px 50px rgba(0,0,0,.17)}.panel-head{height:55px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:12px;letter-spacing:-.01em}.panel-head span{color:var(--muted);font-size:10px}.search{width:calc(100% - 20px);margin:10px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel2);color:var(--text);font-size:12px;outline:none}.search:focus{border-color:rgba(98,230,210,.55)}.list{padding:0 8px 12px;max-height:630px;overflow:auto}.item{display:grid;grid-template-columns:29px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;padding:9px 7px;border:0;border-radius:9px;background:transparent;text-align:left;cursor:pointer}.item:hover,.item:focus-visible{background:rgba(255,255,255,.055);outline:none}.item.active{background:var(--cyan-bg)}.glyph{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.06);color:var(--blue);font-size:10px;font-weight:800}.item.active .glyph{color:var(--cyan);background:rgba(98,230,210,.18)}.item strong,.item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item strong{font-size:12px;font-weight:640}.item small{margin-top:2px;color:var(--muted);font-size:10px}.dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}.dot.read{background:var(--amber)}.main{display:flex;flex-direction:column}.detail{padding:24px;overflow:auto;max-height:665px}.detail h2{margin:4px 0 8px;font-size:29px;line-height:1;letter-spacing:-.055em}.detail p{color:var(--muted);font-size:13px;line-height:1.55}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:17px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:5px 8px;color:var(--muted);font-size:10px}.chip.cyan{color:var(--cyan);border-color:rgba(98,230,210,.24);background:var(--cyan-bg)}.subhead{display:flex;justify-content:space-between;align-items:center;margin:25px 0 8px}.subhead h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.subhead button{border:0;background:transparent;color:var(--cyan);font-size:11px;cursor:pointer}.source{margin:0;max-height:355px;overflow:auto;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:#cad6d9;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;tab-size:2}.source.expanded{max-height:none}.empty{padding:22px 12px;color:var(--muted);font-size:12px;text-align:center}.right{display:flex;flex-direction:column}.summary{padding:16px}.metric{padding:13px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric b{display:block;font-size:23px;letter-spacing:-.06em}.metric span{color:var(--muted);font-size:11px}.notice{margin:0 16px 16px;padding:12px;border-radius:9px;background:var(--panel2);color:var(--muted);font-size:11px;line-height:1.5}.notice b{color:var(--text)}.timeline{padding:4px 16px 15px;overflow:auto}.event{padding:10px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event-meta{color:var(--cyan);font-size:10px;font-weight:650}.event p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.45}.map{position:relative;min-height:205px;margin:16px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);overflow:hidden}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(190,215,222,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(190,215,222,.04) 1px,transparent 1px);background-size:30px 30px}.core{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;display:grid;place-items:center;text-align:center;background:#172b32;border:1px solid rgba(98,230,210,.55);box-shadow:0 0 0 10px rgba(98,230,210,.04),0 0 34px rgba(98,230,210,.12);font-size:11px;font-weight:800;color:var(--cyan)}.core span{display:block;color:var(--muted);font-size:8px;font-weight:500}.orbit{position:absolute;left:50%;top:50%;width:190px;height:190px;transform:translate(-50%,-50%);border-radius:50%;border:1px dashed rgba(98,230,210,.2)}.orbit-node{position:absolute;z-index:2;border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:#16212c;color:var(--text);font-size:9px}.orbit-node:nth-of-type(3){left:12%;top:14%}.orbit-node:nth-of-type(4){right:8%;top:16%}.orbit-node:nth-of-type(5){right:5%;bottom:19%}.orbit-node:nth-of-type(6){left:8%;bottom:16%}.footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.footer b{color:var(--cyan)}.update-row{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}.status{color:var(--amber);font-weight:700}.file{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}@media(max-width:1050px){.workspace{grid-template-columns:250px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.right .panel-head{grid-column:1/-1}.right .summary,.right .notice{margin:0}.right .timeline{max-height:300px}.map{display:none}}@media(max-width:700px){.shell{padding:12px}.top{align-items:flex-start}.live{max-width:135px}.workspace{grid-template-columns:1fr;min-height:0}.right{display:block;grid-column:auto}.detail{max-height:none}.list{max-height:260px}.top h1{font-size:16px}.tabs{margin-top:12px}.source{max-height:280px}}
  </style>
</head>
<body>
  <main class="shell"><header class="top"><div class="brand"><div class="mark">A/</div><div><p class="eyebrow">Biblioteca global · dados gerados localmente</p><h1>Mapa vivo da orquestração</h1></div></div><div class="live"><a href="mapa-interativo.html">Mapa mental animado ↗</a> · <span id="live"></span></div></header><nav class="tabs" id="tabs" aria-label="Seções do painel"></nav><section class="workspace"><aside class="panel"><div class="panel-head"><h2 id="listTitle">Agentes</h2><span id="listCount"></span></div><input class="search" id="search" type="search" placeholder="Filtrar lista…"><div class="list" id="list"></div></aside><section class="panel main"><article class="detail" id="detail"></article><footer class="footer">Fonte: <b id="sourcePath">registry + arquivos locais</b> · Para atualizar os dados, execute <b>python docs/mapa-orquestrador/build-dashboard-data.py</b></footer></section><aside class="panel right"><div class="panel-head"><h2>Estado conectado</h2><span id="generated"></span></div><div id="side"></div></aside></section></main>
  <script src="dashboard-data.js"></script>
  <script>
    const D=window.ORCHESTRATOR_DATA,$=s=>document.querySelector(s);let tab='agents',selected='orchestrator',query='';const symbol=n=>(n||'?').split('-').map(x=>x[0]).join('').slice(0,2).toUpperCase(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tabs=[['agents','Agentes'],['skills','Skills'],['rules','Rules'],['profiles','Perfis'],['updates','Atualizações']];
    function renderTabs(){$('#tabs').innerHTML=tabs.map(([id,label])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selected=tab==='agents'?'orchestrator':'';query='';$('#search').value='';render()})}function collection(){return tab==='agents'?D.agents:tab==='skills'?[...(D.workspaceSkills||[]),...D.skills]:tab==='rules'?D.rules:tab==='profiles'?D.profiles:D.changes}function label(){return {agents:'Agentes e subagentes',skills:'Skills disponíveis',rules:'Rules disponíveis',profiles:'Perfis de instalação',updates:'Atualizações locais'}[tab]}function itemName(x){return tab==='updates'?x.path:(x.name||x.id)}
    function renderList(){const all=collection(),filtered=all.filter(x=>itemName(x).toLowerCase().includes(query.toLowerCase()));$('#listTitle').textContent=label();$('#listCount').textContent=`${filtered.length}/${all.length}`;$('#list').innerHTML=filtered.length?filtered.map(x=>{const id=tab==='updates'?x.path:x.id,read=x.sandbox==='read-only';return `<button class="item ${selected===id?'active':''}" data-id="${esc(id)}"><span class="glyph">${tab==='updates'?esc(x.status):symbol(x.name||x.id)}</span><span><strong>${esc(itemName(x))}</strong><small>${esc(tab==='agents'?x.name:tab==='updates'?x.status:(x.description||x.id))}</small></span>${tab==='agents'?`<i class="dot ${read?'read':''}"></i>`:''}</button>`}).join(''):'<p class="empty">Nenhum item encontrado.</p>';$('#list').querySelectorAll('.item').forEach(b=>b.onclick=()=>{selected=b.dataset.id;renderDetail();renderList()})}function code(title,source){return `<div class="subhead"><h3>${title}</h3><button class="expand">Expandir</button></div><pre class="source">${esc(source||'Fonte não encontrada.')}</pre>`}
    function renderDetail(){let html='';if(tab==='agents'){const a=D.agents.find(x=>x.id===selected)||D.agents[0];html=`<p class="eyebrow">${a.id==='orchestrator'?'Papel principal':'Subagente especialista'}</p><h2>${esc(a.name)}</h2><p>${esc(a.description)}</p><div class="chips"><span class="chip cyan">${esc(a.sandbox)}</span>${a.preferredSkills.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>${code('Prompt efetivo enviado ao runtime',a.runtimePrompt)}${code('Contrato de papel — fonte',a.roleSource)}`;$('#sourcePath').textContent=a.path}else if(tab==='skills'){const x=collection().find(x=>x.id===selected)||collection()[0];html=`<p class="eyebrow">${x.origin==='workspace'?'Skill disponível no ambiente':'Skill da biblioteca'}</p><h2>${esc(x.name)}</h2><p>${esc(x.description)}</p><div class="chips"><span class="chip cyan">origem: ${esc(x.origin)}</span><span class="chip">versão: ${esc(x.version)}</span></div>${code('Procedimento SKILL.md',x.source)}`;$('#sourcePath').textContent=x.path}else if(tab==='rules'){const x=D.rules.find(x=>x.id===selected)||D.rules[0];html=`<p class="eyebrow">Regra aplicável</p><h2>${esc(x.name)}</h2><p>${esc(x.description||'Regra de execução e qualidade da biblioteca.')}</p>${code('Fonte da rule',x.source)}`;$('#sourcePath').textContent=x.path}else if(tab==='profiles'){const x=D.profiles.find(x=>x.id===selected)||D.profiles[0];html=`<p class="eyebrow">Perfil de instalação</p><h2>${esc(x.id)}</h2><p>${esc(x.description)}</p><div class="chips"><span class="chip cyan">até ${x.maxConcurrentSpecialists} especialistas</span><span class="chip">${x.skills.length} skills</span><span class="chip">${x.rules.length+x.conditionalRules.length} rules</span></div>${code('Composição do perfil',JSON.stringify(x,null,2))}`;$('#sourcePath').textContent=`profiles/${x.id}.json`}else{const x=D.changes.find(x=>x.path===selected)||D.changes[0];html=x?`<p class="eyebrow">Alteração detectada pelo Git</p><h2>${esc(x.path)}</h2><p>Estado atual: <b>${esc(x.status)}</b>. Esta lista é gerada do estado de trabalho local no momento em que o painel é atualizado.</p><div class="chips"><span class="chip cyan">${esc(x.status)}</span></div>`:'<p class="eyebrow">Estado Git</p><h2>Sem alterações locais</h2><p>O gerador não encontrou arquivos modificados ou não rastreados.</p>';$('#sourcePath').textContent='git status --short'}$('#detail').innerHTML=html;$('#detail').querySelectorAll('.expand').forEach(b=>b.onclick=()=>{const pre=b.parentElement.nextElementSibling;pre.classList.toggle('expanded');b.textContent=pre.classList.contains('expanded')?'Recolher':'Expandir'})}
    function renderSide(){const recent=D.events.slice(0,5);$('#side').innerHTML=`<div class="summary"><div class="metric"><b>${D.agents.length}</b><span>papéis: 1 orquestrador + ${D.agents.length-1} subagentes</span></div><div class="metric"><b>${D.skills.length}</b><span>skills da biblioteca por perfil</span></div><div class="metric"><b>${(D.workspaceSkills||[]).length}</b><span>skills extras descobertas no ambiente</span></div><div class="metric"><b>${D.rules.length}</b><span>rules carregáveis por perfil</span></div></div><div class="map"><div class="orbit"></div><div class="core">ORQUESTRADOR<span>roteia e integra</span></div><i class="orbit-node">Arquitetura</i><i class="orbit-node">Frontend</i><i class="orbit-node">Dados</i><i class="orbit-node">QA + revisão</i></div><p class="notice"><b>Atualização real:</b> o painel lê um snapshot gerado dos arquivos da biblioteca e do ambiente. Rode o comando no rodapé após qualquer modificação para renovar prompts, skills, rules, perfis, Git e memória.</p><div class="panel-head"><h2>Eventos recentes</h2><span>${recent.length}</span></div><div class="timeline">${recent.map(e=>`<div class="event"><div class="event-meta">${esc(e.kind)} · ${esc(e.actor)}</div><p>${esc(e.content)}</p></div>`).join('')||'<p class="empty">Sem eventos registrados.</p>'}</div>`}function render(){renderTabs();renderList();renderDetail();renderSide()}$('#search').oninput=e=>{query=e.target.value;renderList()};$('#live').innerHTML=`<b>●</b> ${D.version||'sem versão'} · snapshot ${new Date(D.generatedAt).toLocaleString('pt-BR')}`;$('#generated').textContent='snapshot local';render();
  </script>
</body>
</html>
