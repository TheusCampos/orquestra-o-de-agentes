<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mapa mental interativo dos agentes, skills, regras e perfis da biblioteca.">
  <link rel="icon" href="data:,">
  <title>Mapa mental · Orquestração</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --bg:#0a1016; --surface:#111b25; --surface2:#172530; --ink:#e9f2f2; --muted:#94aab0; --line:rgba(184,214,222,.18); --accent:#67e5d2; --warm:#edbb72; --blue:#94baff; --ease-out:cubic-bezier(.23,1,.32,1); }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); min-width:320px; } button,a { font:inherit; } button { color:inherit; } a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; } :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .app { height:100vh; min-height:700px; padding:18px; display:grid; grid-template-rows:auto minmax(0,1fr); gap:14px; background:radial-gradient(circle at 48% 40%,rgba(103,229,210,.065),transparent 43%); }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; max-width:1800px; width:100%; margin:auto; }
    .brand { display:flex; align-items:center; gap:12px; } .mark { width:40px; height:40px; display:grid; place-items:center; color:var(--accent); border:1px solid var(--accent); border-radius:12px 3px 12px 3px; font-weight:800; }
    .kicker { margin:0 0 3px; font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; } h1 { margin:0; font-size:20px; letter-spacing:-.04em; } .head-actions { display:flex; align-items:center; gap:18px; color:var(--muted); font-size:12px; } .head-actions span { white-space:nowrap; }
    .layout { max-width:1800px; width:100%; margin:auto; min-height:0; height:100%; display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; }
    .canvas, .inspector { border:1px solid var(--line); border-radius:16px; background:rgba(17,27,37,.94); overflow:hidden; }
    .canvas { min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; }
    .toolbar { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; } .toolbar strong { font-size:13px; } .toolbar p { margin:4px 0 0; color:var(--muted); font-size:11px; } .filters { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; }
    .filter { border:1px solid var(--line); border-radius:7px; background:transparent; color:var(--muted); padding:7px 10px; font-size:11px; cursor:pointer; transition:background 180ms var(--ease-out),color 180ms var(--ease-out); } .filter[aria-pressed="true"] { color:var(--accent); background:rgba(103,229,210,.12); border-color:rgba(103,229,210,.35); }
    .graph-scroll { min-height:0; overflow:hidden; } .graph { position:relative; width:100%; height:100%; min-height:0; overflow:hidden; background:linear-gradient(rgba(194,220,226,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(194,220,226,.035) 1px,transparent 1px); background-size:38px 38px; }
    .graph::before,.graph::after { content:""; position:absolute; width:410px; height:410px; border:1px dashed rgba(103,229,210,.13); border-radius:50%; left:50%; top:48%; transform:translate(-50%,-50%); pointer-events:none; } .graph::after { width:590px; height:590px; border-color:rgba(148,186,255,.1); }
    svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; } .edge { fill:none; stroke:rgba(148,186,255,.25); stroke-width:1.4; transition:stroke 200ms var(--ease-out),stroke-width 200ms var(--ease-out),opacity 200ms var(--ease-out); } .edge.selected { stroke:var(--accent); stroke-width:2; } .edge.dim { opacity:.2; } .edge.signal { stroke:var(--accent); stroke-width:2; stroke-dasharray:7 55; animation:travel 1.8s linear infinite; }
    .node { position:absolute; z-index:2; transform:translate(-50%,-50%); width:136px; min-height:51px; padding:8px 10px; border:1px solid rgba(184,214,222,.23); border-radius:10px; background:#192934; text-align:left; cursor:pointer; display:flex; align-items:center; gap:8px; box-shadow:0 8px 18px rgba(0,0,0,.18); transition:transform 180ms var(--ease-out),opacity 180ms var(--ease-out),border-color 180ms var(--ease-out),background 180ms var(--ease-out); animation:arrive 500ms var(--ease-out) backwards; } .node:hover { transform:translate(-50%,-50%) scale(1.045); border-color:var(--accent); } .node.selected { border-color:var(--accent); background:#214047; } .node.dim { opacity:.38; } .node .symbol { flex:none; width:27px; height:27px; display:grid; place-items:center; border-radius:7px; background:rgba(148,186,255,.14); color:var(--blue); font-size:10px; font-weight:760; } .node.read .symbol { color:var(--warm); background:rgba(237,187,114,.12); } .node b,.node small { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; } .node b { font-size:11px; } .node small { color:var(--muted); font-size:9px; margin-top:2px; }
    .node.core { width:170px; height:170px; border-radius:50%; padding:18px; flex-direction:column; justify-content:center; text-align:center; background:#163039; border-color:rgba(103,229,210,.62); box-shadow:0 0 0 12px rgba(103,229,210,.04),0 0 55px rgba(103,229,210,.1); } .node.core .symbol { width:34px; height:34px; color:var(--accent); background:rgba(103,229,210,.13); } .node.core b { font-size:16px; letter-spacing:-.04em; } .node.core small { white-space:normal; line-height:1.3; }
    .node.topic { width:122px; background:#17252b; border-color:rgba(103,229,210,.28); } .node.topic .symbol { color:var(--accent); background:rgba(103,229,210,.1); }
    .legend { padding:10px 18px; display:flex; gap:18px; flex-wrap:wrap; border-top:1px solid var(--line); color:var(--muted); font-size:10px; } .legend i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--blue); } .legend .read { background:var(--warm); } .legend .data { background:var(--accent); }
    .inspector { display:flex; flex-direction:column; min-height:0; } .inspect-head { padding:16px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:650; } .inspect-head span { color:var(--accent); font-size:10px; } .inspect-body { overflow:auto; padding:19px; flex:1; } .inspect-body h2 { font-size:25px; letter-spacing:-.055em; line-height:1.05; margin:5px 0 9px; overflow-wrap:anywhere; } .inspect-body p { color:var(--muted); font-size:12px; line-height:1.55; } .section-title { margin:22px 0 8px; color:var(--ink); font-size:11px; font-weight:700; } .pill-list { display:flex; flex-wrap:wrap; gap:6px; } .pill { border:1px solid var(--line); background:var(--surface2); border-radius:7px; padding:6px 8px; color:var(--muted); font-size:10px; } .pill.action { cursor:pointer; color:var(--accent); } .pill.action:hover { border-color:var(--accent); } pre { max-height:260px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; padding:12px; border:1px solid var(--line); border-radius:9px; background:#0c151c; color:#cad8db; font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; } .inspect-foot { padding:12px 18px; border-top:1px solid var(--line); color:var(--muted); font-size:10px; line-height:1.5; }
    @keyframes arrive { from { opacity:0; transform:translate(-50%,-50%) scale(.95); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } } @keyframes travel { to { stroke-dashoffset:-62; } }
    @media(max-width:1150px) { .app { height:auto; } .layout { grid-template-columns:1fr; height:auto; } .inspector { min-height:340px; } .canvas { height:720px; } }
    @media(max-width:700px) { .app { padding:10px; } header { align-items:flex-start; } .head-actions span { display:none; } .toolbar { align-items:flex-start; flex-direction:column; } .toolbar p::after { content:' Deslize o mapa para os lados para ver todos os nós.'; } .filters { justify-content:flex-start; } .canvas { height:890px; } .graph-scroll { overflow-x:auto; overflow-y:hidden; touch-action:pan-x; scrollbar-color:var(--accent) var(--surface2); } .graph { width:920px; min-height:0; } .graph::before { width:380px; height:380px; } .graph::after { width:560px; height:560px; } .node { width:112px; padding:6px; min-height:42px; } .node .symbol { width:22px; height:22px; font-size:8px; } .node b { font-size:10px; } .node small { font-size:8px; } .node.core { width:140px; height:140px; } .node.core b { font-size:13px; } .node.topic { width:104px; } .legend { gap:8px; } }
    @media(prefers-reduced-motion:reduce) { .node { animation:none; transition:background 180ms ease,border-color 180ms ease,opacity 180ms ease; } .node:hover { transform:translate(-50%,-50%); } .edge { transition:none; } .edge.signal { animation:none; stroke-dasharray:none; } }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand"><div class="mark">A/</div><div><p class="kicker">Biblioteca global de agentes</p><h1>Mapa mental da orquestração</h1></div></div><div class="head-actions"><span id="version"></span><a href="dashboard.html">Abrir painel completo ↗</a></div></header>
    <div class="layout"><section class="canvas" aria-label="Mapa mental interativo"><div class="toolbar"><div><strong>Agentes, capacidades e fontes</strong><p>Selecione um nó para destacar relações e ler seu contrato.</p></div><div class="filters" id="filters"></div></div><div class="graph-scroll" id="graphScroll"><div class="graph" id="graph"><svg id="edges" aria-hidden="true"></svg></div></div><div class="legend"><span><i></i> Pode implementar</span><span><i class="read"></i> Consulta e análise</span><span><i class="data"></i> Catálogo e perfis</span><span>Conexões indicam elegibilidade, não execução ativa.</span></div></section><aside class="inspector" aria-live="polite"><div class="inspect-head">Inspetor <span id="kind"></span></div><div class="inspect-body" id="detail"></div><div class="inspect-foot" id="freshness"></div></aside></div>
  </main>
  <script src="dashboard-data.js"></script>
  <script>
    const data=window.ORCHESTRATOR_DATA;
    const graph=document.querySelector('#graph'), edges=document.querySelector('#edges'), detail=document.querySelector('#detail');
    const roles={ceo:'CEO', 'product-manager':'Produto', designer:'Designer', architect:'Arquitetura', frontend:'Frontend', backend:'Backend', data:'Dados', qa:'QA', reviewer:'Revisão', security:'Segurança', devops:'DevOps', developer:'Developer', orchestrator:'Orquestrador'};
    const positions={orchestrator:[50,48],ceo:[20,13],'product-manager':[42,10],designer:[69,12],frontend:[87,27],backend:[88,48],data:[82,70],devops:[64,85],qa:[43,85],reviewer:[22,78],security:[11,57],developer:[14,35],architect:[62,27],skills:[28,53],rules:[70,54],profiles:[50,68]};
    const handoffs=[['ceo','product-manager'],['product-manager','designer'],['designer','frontend'],['architect','backend'],['backend','data'],['backend','security'],['backend','devops'],['frontend','qa'],['developer','qa'],['qa','reviewer']];
    let selected='orchestrator', filter='all';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const topics=[{id:'skills',name:'Skills',count:data.skills.length+(data.workspaceSkills||[]).length},{id:'rules',name:'Rules',count:data.rules.length},{id:'profiles',name:'Perfis',count:data.profiles.length}];
    const label=id=>roles[id]||id;
    function visible(id){if(filter==='all')return true;if(filter==='agents')return !['skills','rules','profiles'].includes(id);if(filter==='sources')return id==='orchestrator'||['skills','rules','profiles'].includes(id);return true}
    function setFilter(next){filter=next;document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));renderGraph()}
    document.querySelector('#filters').innerHTML=[['all','Tudo'],['agents','Agentes'],['sources','Fontes']].map(([id,name])=>`<button class="filter" data-filter="${id}" aria-pressed="${id==='all'}">${name}</button>`).join('');
    document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.filter)));
    function related(id){if(id==='orchestrator')return new Set([...data.agents.map(a=>a.id),...topics.map(t=>t.id)]);if(['skills','rules','profiles'].includes(id))return new Set(['orchestrator']);return new Set(['orchestrator','skills','rules','profiles',...handoffs.filter(pair=>pair.includes(id)).flat()])}
    function renderGraph(){graph.querySelectorAll('.node').forEach(n=>n.remove());for(const a of data.agents){if(!visible(a.id))continue;const p=positions[a.id];if(!p)continue;const b=document.createElement('button');b.className=`node ${a.id==='orchestrator'?'core ':''}${a.sandbox==='read-only'?'read ':''}${selected===a.id?'selected ':''}${selected!==a.id&&!related(selected).has(a.id)?'dim':''}`;b.dataset.id=a.id;b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.style.animationDelay=Math.min(data.agents.indexOf(a)*40,440)+'ms';b.innerHTML=`<span class="symbol">${esc(label(a.id).slice(0,2).toUpperCase())}</span><span><b>${esc(label(a.id))}</b><small>${a.id==='orchestrator'?'roteia e integra':a.sandbox==='read-only'?'análise e contrato':'implementação'}</small></span>`;b.addEventListener('click',()=>select(a.id));graph.appendChild(b)}for(const t of topics){if(!visible(t.id))continue;const p=positions[t.id],b=document.createElement('button');b.className=`node topic ${selected===t.id?'selected ':''}${selected!==t.id&&!related(selected).has(t.id)?'dim':''}`;b.dataset.id=t.id;b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.innerHTML=`<span class="symbol">${t.count}</span><span><b>${t.name}</b><small>catálogo</small></span>`;b.addEventListener('click',()=>select(t.id));graph.appendChild(b)}drawEdges()}
    function drawEdges(){const box=graph.getBoundingClientRect(), point=id=>{const el=graph.querySelector(`[data-id="${id}"]`);if(!el)return null;const r=el.getBoundingClientRect();return [r.left+r.width/2-box.left,r.top+r.height/2-box.top]};edges.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);let html='';for(const id of [...data.agents.map(a=>a.id),...topics.map(t=>t.id)]){if(id==='orchestrator'||!visible(id))continue;const a=point('orchestrator'),b=point(id);if(!a||!b)continue;const active=selected==='orchestrator'||selected===id;const cls=active?'selected':'dim';html+=`<path class="edge ${cls}" d="M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}"></path>`;if(active&&selected===id)html+=`<path class="edge signal" d="M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}"></path>`}for(const [from,to] of handoffs){if(!visible(from)||!visible(to))continue;const a=point(from),b=point(to);if(!a||!b)continue;const active=selected===from||selected===to;html+=`<path class="edge ${active?'selected':'dim'}" stroke-dasharray="3 5" d="M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}"></path>`}edges.innerHTML=html}
    function select(id){selected=id;renderGraph();renderDetail()}
    function list(title,items){return `<h3 class="section-title">${title} · ${items.length}</h3><div class="pill-list">${items.length?items.map(s=>`<span class="pill">${esc(s)}</span>`).join(''):'<span class="pill">Nenhum</span>'}</div>`}
    function renderDetail(){const a=data.agents.find(x=>x.id===selected);document.querySelector('#kind').textContent=a?a.sandbox:'catálogo';if(a){const route=data.skillRouting?.agents?.[a.id]||[];const profileNames=data.profiles.filter(p=>p.agents.includes(a.id)).map(p=>p.id);detail.innerHTML=`<p class="kicker">${a.id==='orchestrator'?'Ponto de entrada':'Subagente especialista'}</p><h2>${esc(a.name)}</h2><p>${esc(a.description)}</p>${list('Skills da biblioteca',a.preferredSkills||[])}${list('Skills do ambiente elegíveis',route)}${list('Perfis que incluem este agente',profileNames)}<h3 class="section-title">Prompt do agente</h3><pre>${esc(a.runtimePrompt||a.roleSource)}</pre><p><a href="dashboard.html">Ver prompt e fontes no painel ↗</a></p>`}else if(selected==='skills'){const local=data.workspaceSkills||[];detail.innerHTML=`<p class="kicker">Capacidades</p><h2>Skills</h2><p>As skills da biblioteca são instaladas por perfil. As skills do ambiente dependem de disponibilidade na sessão e do roteamento por papel.</p>${list('Biblioteca',data.skills.map(s=>s.name))}${list('Ambiente local',local.map(s=>s.name))}<p><a href="dashboard.html">Ler cada SKILL.md no painel ↗</a></p>`}else if(selected==='rules'){detail.innerHTML=`<p class="kicker">Diretrizes</p><h2>Rules</h2><p>Os perfis selecionam as regras aplicáveis. O orquestrador também respeita as instruções do projeto e do usuário.</p>${list('Regras catalogadas',data.rules.map(r=>r.name||r.id))}<p><a href="dashboard.html">Ler cada regra no painel ↗</a></p>`}else{detail.innerHTML=`<p class="kicker">Composição</p><h2>Perfis</h2><p>Cada perfil instala um conjunto de agentes, skills e rules. O orquestrador chama apenas os papéis necessários para o pedido.</p>${list('Perfis disponíveis',data.profiles.map(p=>p.id))}<p><a href="dashboard.html">Comparar composições no painel ↗</a></p>`}}
    document.querySelector('#version').textContent=`v${data.version} · ${data.agents.length} agentes · ${data.skills.length} skills`;
    document.querySelector('#freshness').textContent=`Snapshot gerado em ${new Date(data.generatedAt).toLocaleString('pt-BR')}. Para refletir alterações nos arquivos, execute python docs/mapa-orquestrador/build-dashboard-data.py.`;
    new ResizeObserver(drawEdges).observe(graph);renderGraph();renderDetail();if(matchMedia('(max-width:700px)').matches){const scroller=document.querySelector('#graphScroll');scroller.scrollLeft=(scroller.scrollWidth-scroller.clientWidth)/2}
  </script>
</body>
</html>
